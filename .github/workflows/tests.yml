name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest --cov=custom_components.grohm --cov-fail-under=95
