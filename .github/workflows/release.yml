name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  zip:
    name: Attach grohm.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in the manifest
        run: |
          version=$(jq -r .version custom_components/grohm/manifest.json)
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          }

      # The Marketplace installs from this file (zip_release in hacs.json),
      # and GitHub counts its downloads.
      - name: Build grohm.zip
        run: |
          cd custom_components/grohm
          zip -r "$GITHUB_WORKSPACE/grohm.zip" . -x '__pycache__/*' '*.pyc'

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" grohm.zip --clobber --repo "$GITHUB_REPOSITORY"
